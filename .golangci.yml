linters:
  disable-all: true
  enable:
    - asasalint         # Check for passing []any as any in variadic func(...any)
    - asciicheck        # Check for non-ASCII identifiers
    - bidichk           # Checks for dangerous unicode character sequences
    - bodyclose         # Checks whether HTTP response body is closed successfully
    - canonicalheader   # Checks whether net/http.Header uses canonical header
    - containedctx      # Detects struct contained context.Context field
    - contextcheck      # Check if a function uses a non-inherited context
    - decorder          # Check declaration order and count of types, constants, variables and functions
    - dogsled           # Checks assignments with too many blank identifiers
    - dupl              # Code clone detection
    - dupword           # Checks for duplicate words in the source code
    - durationcheck     # Check for two durations multiplied together
    - err113            # Check error handling expressions
    - errcheck          # Checking for unchecked errors
    - errchkjson        # Checks types passed to the JSON encoding functions
    - errname           # Checks that sentinel errors are prefixed with `Err` and error types are suffixed with `Error`
    - errorlint         # Find code that will cause problems with error wrapping
    - exhaustive        # Check exhaustiveness of enum switch statements
    # - exportloopref     # Checks for pointers to enclosing loop variables (deprecated in Go 1.22)
    - fatcontext        # Detects nested contexts in loops
    - forbidigo         # Forbids identifiers
    - forcetypeassert   # Finds forced type assertions
    - funlen            # Detection of long functions
    - gci               # Control package import order and make it always deterministic
    - ginkgolinter      # Enforces standards of using ginkgo and gomega
    - gocheckcompilerdirectives # Checks that go compiler directive comments (//go:) are valid
    - gochecknoinits    # Checks that no init functions are present in Go code
    - gochecksumtype    # Run exhaustiveness checks on Go "sum types"
    - gocognit          # Computes and checks the cognitive complexity of functions
    - goconst           # Finds repeated strings that could be replaced by a constant
    - gocritic          # The most opinionated Go source code linter
    - gocyclo           # Computes and checks the cyclomatic complexity of functions
    - godot             # Check if comments end in a period
    - godox             # Detection of FIXME, TODO and other comment keywords
    - gofmt             # Checks whether code was gofmt-ed
    - gofumpt           # Checks whether code was gofumpt-ed
    - goimports         # Does everything that gofmt does and checks unused imports
    - gomoddirectives   # Manage the use of 'replace', 'retract', and 'excludes' in go.mod
    - goprintffuncname  # Checks that printf-like functions are named with `f` at the end
    - gosec             # Inspects source code for security problems
    - gosimple          # Specializes in simplifying code
    - gosmopolitan      # Report certain i18n/l10n anti-patterns in your Go codebase
    - govet             # Reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - grouper           # An analyzer to analyze expression groups
    - importas          # Enforces consistent import aliases
    - inamedparam       # Reports interfaces with unnamed method parameters
    - ineffassign       # Detects when assignments to existing variables are not used
    - interfacebloat    # Checks the number of methods inside an interface
    - ireturn           # Accept interfaces, return concrete types
    - loggercheck       # Checks key value pairs for common logger libraries
    - maintidx          # Measures the maintainability index of each function
    - makezero          # Finds slice declarations with non-zero initial length
    - mirror            # Reports wrong mirror patterns of bytes/strings usage
    - misspell          # Finds commonly misspelled English words in comments
    - nakedret          # Finds naked returns in functions greater than a specified function length
    - nestif            # Reports deeply nested if statements
    - nilerr            # Finds the code that returns nil even if it checks that the error is not nil
    - nilnil            # Checks that there is no simultaneous return of `nil` error and an invalid value
    - nlreturn          # Checks for a new line before return and branch statements
    - noctx             # Finds sending HTTP request without context.Context
    - nolintlint        # Reports ill-formed or insufficient nolint directives
    - nosprintfhostport # Checks for misuse of Sprintf to construct a host with port in a URL
    - perfsprint        # Checks that fmt.Sprintf can be replaced with a faster alternative
    - prealloc          # Finds slice declarations that could potentially be preallocated
    - predeclared       # Find code that shadows one of Go's predeclared identifiers
    - promlinter        # Check Prometheus metrics naming via promlint
    - protogetter       # Reports direct reads from proto message fields when getters should be used
    - reassign          # Checks that package variables are not reassigned
    - revive            # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck      # Checks whether err of rows is checked successfully
    - sloglint          # Ensure consistent code style when using log/slog
    - spancheck         # Checks for mistakes with OpenTelemetry/Census spans
    - sqlclosecheck     # Checks that sql.Rows and sql.Stmt are closed
    - staticcheck       # Go vet on steroids, applying a ton of static analysis checks
    - stylecheck        # Replacement for golint
    - tagalign          # Checks that struct tags are well aligned
    - tagliatelle       # Checks the struct tags
    # - tenv              # Detects using os.Setenv instead of t.Setenv (replaced by usetesting)
    - testableexamples  # Checks if examples are testable
    - testifylint       # Checks usage of github.com/stretchr/testify
    - testpackage       # Makes you use a separate _test package
    - thelper           # Detects test helpers without t.Helper() and checks the consistency of test helpers
    - tparallel         # Detects inappropriate usage of t.Parallel() method in Go test code
    - typecheck         # Like the front-end of a Go compiler, parses and type-checks Go code
    - unconvert         # Remove unnecessary type conversions
    - unparam           # Reports unused function parameters
    - unused            # Checks for unused constants, variables, functions and types
    - usestdlibvars     # Detect the possibility to use variables/constants from the Go standard library
    - wastedassign      # Finds wasted assignment statements
    - whitespace        # Detection of leading and trailing whitespace
    - wrapcheck         # Checks that errors returned from external packages are wrapped
    - wsl               # Whitespace Linter - Forces you to use empty lines!
    - zerologlint       # Detects the wrong usage of `zerolog` that a user forgets to dispatch with `Send` or `Msg`

    # Now enabled with Go 1.22+
    - copyloopvar       # Detects places where loop variables are copied
    # - intrange          # Finds places where for loops could make use of an integer range (disabled for now)

    # Additional useful linters for code quality
    - cyclop            # Checks function and package cyclomatic complexity
    - exhaustruct       # Checks if all structure fields are initialized
    - goheader          # Checks if file header matches to pattern
    - lll               # Reports long lines
    - mnd               # An analyzer to detect magic numbers
    - musttag           # Enforce field tags in (un)marshaled structs
    - nonamedreturns    # Reports all named returns
    - paralleltest      # Detects missing usage of t.Parallel() method in tests

    # Optional - uncomment if desired:
    #- depguard          # Checks if package imports are in a list of acceptable packages
    #- gochecknoglobals  # Checks that no globals are present
    #- gomodguard        # Allow and block list linter for direct Go module dependencies
    #- varnamelen        # Checks that the length of a variable's name matches its scope

issues:
  exclude-use-default: false
  exclude-rules:
    # Test-related exclusions
    - path: _test\.go
      linters:
        - exhaustruct     # Tests often don't need all struct fields
        - paralleltest    # Not all tests need to be parallel
        - goheader        # Test files may have different headers
        - funlen          # Test functions can be longer
        - cyclop          # Test functions can have higher complexity
        - mnd             # Magic numbers are common in test data

    # Exclude checking header for all .github files
    - path: \.github/
      linters:
        - goheader

    # Specific file exclusions
    - path: beast/internal/
      linters:
        - exhaustruct     # Internal test mocks don't need all fields

    # Exclude common ADS-B magic numbers and bit positions
    - path: adsb/
      linters:
        - mnd
      text: "Magic number: [0-9]+, in <argument> detected"

    # Exclude goheader since our headers are already correct
    - linters:
        - goheader
      text: "Actual: Copyright 2024 Collin Kreklow"

    # Exclude common math constants and ADS-B protocol numbers
    - text: "Magic number: 0.5"
      linters:
        - mnd
    - text: "Magic number: [0-9]+, in <case> detected"
      linters:
        - mnd
    - text: "Magic number: [0-9]+, in <condition> detected"
      linters:
        - mnd
    - text: "Magic number: 0x[0-9a-fA-F]+, in <condition> detected"
      linters:
        - mnd
    - text: "Magic number: [0-9]+, in <(argument|operation|assign|return)> detected"
      linters:
        - mnd
    - text: "Magic number: 0x[0-9a-fA-F]+, in <(argument|operation|case|assign|return)> detected"
      linters:
        - mnd
    - text: "Magic number: 0b[01]+, in <operation> detected"
      linters:
        - mnd
    # Additional ADS-B specific exclusions
    - text: "Magic number: 360.0, in <operation> detected"
      linters:
        - mnd
    - text: "Magic number: 131072, in <operation> detected"
      linters:
        - mnd
    - text: "Magic number: [0-9]+.[0-9]+, in <assign> detected"
      linters:
        - mnd
    - text: "Magic number: [0-9]+.0, in <operation> detected"
      linters:
        - mnd
    # Style preferences
    - linters:
        - wsl
      text: "return statements should not be cuddled if block has more than two lines"
    # Allow named returns for simple getter functions
    - linters:
        - nonamedreturns
      text: "named return \"(bits|p)\" with type \"uint64\" found"

    # Allow nolint directives even if linter is disabled
    - linters:
        - nolintlint
      text: "directive.*is unused for linter"

    # Allow reasonable code formatting preferences
    - linters:
        - wsl
      text: "assignments should only be cuddled with other assignments"
    - linters:
        - wsl
      text: "if statements should only be cuddled with assignments"
    - linters:
        - wsl
      text: "only one cuddle assignment allowed before if statement"
    - linters:
        - nlreturn
      text: "return with no blank line before"

linters-settings:
  gosec:
    excludes:
      - G104
      - G307
      - G115  # integer overflow conversion - safe in this ADS-B context
  nolintlint:
    allow-unused: false
    allow-leading-space: false
    require-explanation: true
    require-specific: true

  # Settings for newly enabled linters
  cyclop:
    max-complexity: 15
    package-average: 10.0

  exhaustruct:
    exclude:
      - "net/http.Client"
      - "net/http.Request"
      - "testing.TB"
      - "testing.F"
      - "testing.B"

  goheader:
    template-path: .github/header_template.txt

  lll:
    line-length: 120

  mnd:
    settings:
      mnd:
        checks:
          - argument
          - case
          - condition
          - operation
          - return
        ignored-numbers:
          - 0
          - 1
          - 2
          - -1
        ignored-functions:
          - "math.*"
          - "strconv.*"

  nonamedreturns:
    report-error-in-defer: false
