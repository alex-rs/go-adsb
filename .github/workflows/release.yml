name: Release on Tag
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release Updates
    steps:
      - name: Refresh go.dev
        run: curl https://proxy.golang.org/github.com/alex-rs/go-adsb/@v/${GITHUB_REF#'refs/tags/'}.info
      - name: Refresh Go Report Card
        run: curl -d "repo=github.com/alex-rs/go-adsb" https://goreportcard.com/checks
