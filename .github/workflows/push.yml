name: Test and Lint
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.21', '1.22', '1.23' ]
    name: Go ${{ matrix.go }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Tests
        run: go test -v -race ./...

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  bench:
    runs-on: ubuntu-latest
    name: Bench Guard
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Benchmark Guard
        run: bash scripts/bench_guard.sh
